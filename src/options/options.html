<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开卷有益 - Leafwise iNaturalist Enhancement 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1 id="page-title">开卷有益 - Leafwise iNaturalist Enhancement 设置</h1>
    <section>
      <h2>常用用户</h2>
      <p>保存多个常用用户名，便可在“观察来源”和“排除已观察”两个下拉框中快捷选择。</p>
      <form id="users-form">
      <label for="username">常用 iNaturalist 用户名</label>
      <textarea id="username" name="username" rows="8" placeholder="observer&#10;another_observer" autocomplete="off" spellcheck="false" disabled></textarea>
      <p>每行一个用户名，可添加、删除或调整顺序。自动去除首尾空白和重复项；留空保存可清空列表。请输入用户名，而非个人主页链接。</p>
      <button type="submit" disabled>保存常用用户</button>
      </form>
      <p id="user-status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section>
      <h2>常用类群</h2>
      <p>这些类群会出现在“未观察的高阶”面板的类群下拉框中。</p>
      <form id="taxa-form">
        <label for="taxa">常用类群 ID 与名称</label>
        <textarea id="taxa" name="taxa" rows="8" placeholder="3 = 鸟纲&#10;48460 = 全部生物" autocomplete="off" spellcheck="false" disabled></textarea>
        <p>每行一个，格式为“ID = 名称”。名称可以省略，保存时会尝试从 iNaturalist 获取中文名；获取失败仍会保存 ID。可添加、删除或调整顺序，留空保存可清空列表。</p>
        <button type="submit" disabled>保存常用类群</button>
      </form>
      <p id="taxa-status" class="status" role="status" aria-live="polite"></p>
    </section>
    <p>修改设置不会自动改变当前页面已经应用的筛选。</p>
  </main>
  <script src="../scripts/saved-users.js"></script>
  <script src="../scripts/saved-taxa.js"></script>
  <script src="options.js"></script>
</body>
</html>
